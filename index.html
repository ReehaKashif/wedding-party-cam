<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding Party Cam</title><style>:root{font-family:Georgia,serif;color:#29231e;background:#faf7f0}*{box-sizing:border-box}body{margin:0}header{text-align:center;padding:24px 12px;border-bottom:1px solid #d6bb85}h1{font-size:32px;margin:8px}button{border:0;border-radius:30px;padding:14px 20px;background:#9b762f;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#share{background:#74501d;font-size:17px;padding:17px 25px}#cameraArea{position:relative}video{aspect-ratio:3/4;max-height:70vh}nav{margin-top:12px}main{max-width:850px;margin:auto;padding:18px}video{width:100%;max-height:460px;background:#151515;border-radius:18px;object-fit:cover}nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:15px}#gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}#gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}#status{text-align:center;min-height:24px}#cameraArea{text-align:center}small{color:#665d51}#setup{background:#fff3d8;padding:12px;border-radius:8px;margin-bottom:12px}@media(min-width:650px){#gallery{grid-template-columns:repeat(3,1fr)}} </style></head><body><header><small>THE WEDDING CELEBRATION</small><h1>Our Party Cam ✨</h1><p>Capture the moment. Share the joy.</p></header><main><div id="setup" hidden>Organizer setup needed: configure Supabase URL and anon key in this file before publishing.</div><div id="cameraArea"><video id="preview" autoplay playsinline muted></video></div><nav><button id="start">Open Camera 📷</button><button id="share">📸 Take & Share Photo</button><button id="flip">↻ Flip Camera</button></nav><p id="status" role="status"></p><h2>Live Wedding Gallery</h2><p><small>Photos appear here automatically. Only share photos you are comfortable showing to every guest.</small></p><div id="gallery"></div></main><script type="module">
// Organizer: replace with values from your Supabase project settings.
const SUPABASE_URL='https://jwqtymufuwxneeudsacd.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_6VQU4UPujIk4dDnz0FLGUw_hHzlvvJe';
const EVENT_ID='our-wedding';
const BUCKET='party-photos';
const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_ANON_KEY.startsWith('YOUR_');
const status=document.querySelector('#status'), video=document.querySelector('#preview');
const gallery=document.querySelector('#gallery');let stream, facing='user', uploading=false, lastIds=new Set();
if(!configured)document.querySelector('#setup').hidden=false;
function msg(t){status.textContent=t}
async function start(){try{stream?.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:1280}}});video.srcObject=stream;await video.play();msg('Ready to capture!')}catch(e){msg('Camera unavailable. Allow camera access and use HTTPS.')}}
document.querySelector('#start').onclick=start;
document.querySelector('#flip').onclick=()=>{facing=facing==='user'?'environment':'user';start()};
function api(path,opts={}){return fetch(`${SUPABASE_URL}/rest/v1/${path}`,{...opts,headers:{apikey:SUPABASE_ANON_KEY,...opts.headers}})}
async function load(){if(!configured)return;try{const res=await api(`party_photos?event_id=eq.${encodeURIComponent(EVENT_ID)}&select=id,path,created_at&order=created_at.desc&limit=300`);if(!res.ok)throw Error('Gallery request failed ('+res.status+')');const items=await res.json();const ids=new Set(items.map(x=>x.id));if(ids.size===lastIds.size&&[...ids].every(id=>lastIds.has(id)))return;lastIds=ids;gallery.replaceChildren(...items.map(item=>{const img=document.createElement('img');img.loading='lazy';img.alt='Guest wedding photo';img.src=`${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${item.path.split('/').map(encodeURIComponent).join('/')}`;return img}))}catch(e){msg('Unable to load gallery. Check configuration.')}}
document.querySelector('#share').onclick=async()=>{if(uploading)return;if(!configured){msg('Organizer must configure the website first.');return}if(!stream){await start();if(!stream)return}if(!video.videoWidth||!video.videoHeight){msg('Camera is starting. Please try again.');return}uploading=true;document.querySelector('#share').disabled=true;msg('Uploading photo…');try{const c=document.createElement('canvas');const max=1200,ratio=Math.min(1,max/Math.max(video.videoWidth,video.videoHeight));c.width=Math.round(video.videoWidth*ratio);c.height=Math.round(video.videoHeight*ratio);c.getContext('2d').drawImage(video,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.72));if(!blob)throw Error('Capture failed');const uuid=crypto.randomUUID(),path=`${EVENT_ID}/${uuid}.jpg`;const up=await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`,{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'image/jpeg','x-upsert':'false'},body:blob});if(!up.ok)throw Error('Photo upload failed ('+up.status+'): '+(await up.text()).slice(0,160));const ins=await api('party_photos',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({id:uuid,event_id:EVENT_ID,path})});if(!ins.ok)throw Error('Photo uploaded, but gallery registration failed ('+ins.status+'): '+(await ins.text()).slice(0,160));msg('Your photo is live! 🎉');await load()}catch(e){msg(e.message)}finally{uploading=false;document.querySelector('#share').disabled=false}};
load();setInterval(load,3000);
// On phones, the camera is opened only after a user taps Open Camera.
</script></body></html>
