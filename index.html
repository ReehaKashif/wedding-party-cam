  try{
    for(const [index,file] of files.entries()){
      progress.textContent=`Uploading photo ${index+1} of ${files.length}…`;
      const url=URL.createObjectURL(file);
      try{
        const image=new Image();
        image.src=url;
        await image.decode();
        const scale=Math.min(1,2048/Math.max(image.naturalWidth,image.naturalHeight));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
        canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
        canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
        const jpeg=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.9));
        if(!jpeg)throw Error('Could not prepare photo.');
        const item=await uploadToDrive(jpeg,crypto.randomUUID());
        mergeSourceItems('drive',[{...item,source:'drive'}],false);
        uploaded++;
        renderGallery();
      }catch(error){
        console.warn('Guest photo upload failed',error);
      }finally{
        URL.revokeObjectURL(url);
      }
    }
  }finally{
    uploadButton.disabled=false;
    progress.textContent=`${uploaded} of ${files.length} photos shared.`+
      (uploaded<files.length?' Please try again with the remaining photos.':'');
  }
};
async function uploadCapture(blob,type){
  if(pendingCapture && pendingCapture.blob!==blob)throw Error('Save or retry your previous capture first.');
  if(!pendingCapture)pendingCapture={blob,type,id:crypto.randomUUID()};
  const pending=pendingCapture;recovery.hidden=true;
  try{const item=await uploadToDrive(blob,pending.id);
    pendingCapture=null;recovery.hidden=true;item.source='drive';mergeSourceItems('drive',[item],false);galleryInitialized=false;
    $('#galleryThumb').textContent=type==='video'?'▶':'📷';notify('✓ Saved to wedding Drive');return item;
  }catch(e){recovery.hidden=false;throw e}
}
retryButton.onclick=async()=>{if(busy||!pendingCapture)return;busy=true;$('#shutter').disabled=true;retryButton.disabled=true;try{await uploadCapture(pendingCapture.blob,pendingCapture.type);setStatus('Saved to Drive')}catch(e){notify(e.message)}finally{busy=false;$('#shutter').disabled=false;retryButton.disabled=false}};
saveButton.onclick=()=>{if(pendingCapture){saveBlob(pendingCapture.blob,'wedding_'+pendingCapture.id+(pendingCapture.type==='photo'?'.jpg':pendingCapture.blob.type.includes('mp4')?'.mp4':'.webm'));if(confirm('Has the file saved successfully? Clear this pending capture?')){pendingCapture=null;recovery.hidden=true}}};
$('#downloadCurrent').onclick=async()=>{if(!currentMedia)return;const btn=$('#downloadCurrent');btn.disabled=true;try{await downloadItem(currentMedia)}catch(e){alert(e.message)}finally{btn.disabled=false}};
$('#downloadAll').onclick=async()=>{
 const btn=$('#downloadAll'),progress=$('#downloadProgress');btn.disabled=true;
 try{
  if(!window.JSZip)throw Error('ZIP library unavailable. Use individual Save buttons.');
  const items=[...allLoadedItems];if(!items.length)throw Error('Open the gallery and load some memories first.');
  let zip=new JSZip(),bytes=0,files=0,part=1,failed=0;
  async function finish(){if(!files)return;saveBlob(await zip.generateAsync({type:'blob',compression:'STORE'}),'Wedding_Memories_'+(part++)+'.zip');zip=new JSZip();bytes=0;files=0}
  for(let i=0;i<items.length;i++){progress.textContent='Preparing '+(i+1)+' of '+items.length;
   try{const blob=await originalBlob(items[i]);if(files&&bytes+blob.size>60*1024*1024)await finish();zip.file(fileName(items[i]),blob);bytes+=blob.size;files++}catch(e){failed++}
  }
  await finish();progress.textContent='Downloads prepared.'+(failed?' '+failed+' failed; use individual Save to retry.':'');
 }catch(e){progress.textContent=e.message}finally{btn.disabled=false}
};
async function capture(){if(mode==='video'){await toggleRecord();return;}if(busy||cameraStarting)return;if(pendingCapture){notify('Save or retry your previous capture first.');return}if(!stream){await startCamera();if(!stream)return;notify('Camera ready — tap the shutter again.');return}if(!video.videoWidth){notify('Camera is starting. Try again.');return}busy=true;$('#shutter').disabled=true;$('#flash').classList.remove('on');void $('#flash').offsetWidth;$('#flash').classList.add('on');setStatus('Uploading your photo…');try{const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;const ctx=c.getContext('2d');if(facing==='user'){ctx.translate(c.width,0);ctx.scale(-1,1)}ctx.drawImage(video,0,0,c.width,c.height);const blob=await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',.98));if(!blob)throw Error('Could not capture photo');await uploadCapture(blob,'photo');notify('✓ Photo shared with everyone!');setStatus('Photo shared! Take another 📸');if($('#galleryView').classList.contains('open'))await loadGallery(true)}catch(e){setStatus('Photo not shared');notify(e.message)}finally{busy=false;$('#shutter').disabled=false}}
function recordingMime(){const candidates=['video/mp4','video/webm;codecs=vp8,opus','video/webm'];return candidates.find(x=>MediaRecorder.isTypeSupported(x))||''}
function recordingClock(){const sec=Math.floor((Date.now()-recordStarted)/1000);$('#recTime').textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;if(sec>=30&&recorder?.state==='recording')recorder.stop()}
async function toggleRecord(){if(recorder?.state==='recording'){recorder.stop();return}if(busy||cameraStarting)return;if(!window.MediaRecorder){notify('Video recording is not supported in this browser. Try Safari.');return}if(!stream){await startCamera();if(!stream)return}const mime=recordingMime();if(!mime){notify('This browser does not support video recording.');return}try{recordChunks=[];recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000,audioBitsPerSecond:128000});recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onerror=()=>notify('Recording error. Please try again.');recorder.onstop=saveVideo;recordStarted=Date.now();recorder.start(1000);$('#shutter').classList.add('recording');$('#recBadge').classList.add('on');recordingClock();recordTimer=setInterval(recordingClock,250);setStatus('Recording… tap shutter to stop');}catch(e){notify(`Cannot start recording: ${e.message}`)}}
async function saveVideo(){clearInterval(recordTimer);$('#recBadge').classList.remove('on');$('#shutter').classList.remove('recording');busy=true;$('#shutter').disabled=true;setStatus('Uploading video…');try{const mime=recorder.mimeType;const blob=new Blob(recordChunks,{type:mime});if(blob.size<1000)throw Error('Video is empty. Please try again.');if(blob.size>40*1024*1024)throw Error('Video exceeds 40 MB. Please record a shorter clip.');await uploadCapture(blob,'video');notify('✓ Video shared with everyone!');setStatus('Video shared! Record another 🎥');if($('#galleryView').classList.contains('open'))await loadGallery(true)}catch(e){setStatus('Video not shared');notify(e.message)}finally{busy=false;$('#shutter').disabled=false}}
$('#shutter').onclick=capture;
function showGallery(){if(recorder?.state==='recording'){notify('Stop recording first.');return}$('#galleryView').classList.add('open');if(!galleryInitialized)loadGallery(true);else renderGallery()}
$('#galleryTop').onclick=showGallery;$('#galleryThumb').onclick=showGallery;$('#back').onclick=()=>{$('#galleryView').classList.remove('open');thumbObserver.disconnect()};$('#closeViewer').onclick=closeViewer;$('#viewer').onclick=e=>{if(e.target===$('#viewer'))closeViewer()};
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});
window.addEventListener('beforeunload',e=>{if(busy||pendingCapture||recorder?.state==='recording'){e.preventDefault();e.returnValue=''}});
bridgeReady.then(()=>driveRequest('ping')).then(()=>setStatus('Drive connected · Ready to capture')).catch(e=>{setStatus('Drive not connected');notify(e.message)});
// Retry after returning from permission settings when the camera is still inactive.
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!stream&&navigator.mediaDevices?.getUserMedia)startCamera()});
// Attempt to open the camera as soon as the guest visits. On browsers that
// require a tap, show a compact Enable Camera button only as a fallback.
if(navigator.mediaDevices?.getUserMedia){startCamera()}else{$('#cameraLoading').textContent='Open this website in Safari or Chrome to use the camera.';$('#start').style.display='inline-block'}
